<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Метеоритный защитник — УРОВЕНЬ 3 (БОМБА РАБОТАЕТ)</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #020a12, #000000);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-container {
            background: #000000aa;
            border-radius: 42px;
            padding: 20px;
            backdrop-filter: blur(2px);
            box-shadow: 0 25px 40px black;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 0 0 3px #2a4c7a, 0 15px 30px black;
            cursor: none;
        }
        .top-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 10px;
            background: #0a0f1cee;
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 6px 28px;
            color: #c0e4ff;
            font-weight: bold;
            gap: 20px;
            flex-wrap: wrap;
        }
        .score, .health, .level {
            font-size: 1.4rem;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #0088ff;
        }
        .restart-btn, .bomb-btn {
            background: #2a4b6e;
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            padding: 4px 20px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: 0.08s linear;
        }
        .bomb-btn {
            background: #aa4422;
        }
        .bomb-btn:hover {
            background: #cc5533;
            transform: scale(0.96);
        }
        .bomb-btn.disabled {
            background: #442211;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .restart-btn:hover {
            background: #3f6f9e;
            transform: scale(0.96);
        }
        .shop-panel {
            background: #05070cd9;
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 12px 18px;
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 1000px;
            min-height: 100px;
        }
        .upgrade-card {
            background: #19232fd9;
            border-radius: 28px;
            padding: 8px 12px;
            min-width: 110px;
            text-align: center;
            color: #ffe3b0;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.07s linear;
            border: 1px solid #7c9bc0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .upgrade-card:hover {
            background: #2d405be6;
            transform: scale(0.97);
        }
        .upgrade-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.3);
        }
        .upgrade-name { font-size: 0.85rem; font-weight: bold; }
        .upgrade-price { color: #ffcc77; font-size: 0.8rem; }
        .upgrade-level { font-size: 0.65rem; color: #88ddff; }
        .controls {
            font-size: 0.7rem;
            background: #000000aa;
            border-radius: 36px;
            padding: 6px 20px;
            margin-top: 10px;
            text-align: center;
            color: #9bb8da;
        }
        .level-badge {
            background: #2a4b6e;
            border-radius: 30px;
            padding: 4px 15px;
            font-weight: bold;
        }
        .level-3-badge {
            background: #aa6600;
            box-shadow: 0 0 10px #ffaa44;
        }
        .bomb-status {
            font-size: 0.7rem;
            margin-left: 10px;
            color: #ffaa66;
        }
        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        @media (max-width: 850px) {
            .score, .health, .level { font-size: 1rem; }
            .upgrade-card { min-width: 85px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-container">
        <canvas id="gameCanvas" width="1000" height="650"></canvas>
        <div class="top-panel">
            <div class="score">💎 ОЧКИ: <span id="scoreValue">0</span></div>
            <div class="health">🛡️ ПРОЧНОСТЬ: <span id="healthValue">10</span> / <span id="maxHealthValue">10</span></div>
            <div class="level"><span class="level-badge" id="levelBadge">🌟 УРОВЕНЬ <span id="levelValue">1</span></span></div>
            <button class="restart-btn" id="restartButton">🔄 НОВЫЙ ПОЛЁТ</button>
        </div>
        <div class="shop-panel" id="shopPanel"></div>
        <div style="display: flex; justify-content: center; gap: 15px; margin-top: 8px;">
            <button class="bomb-btn" id="bombButton">💣 АТОМНАЯ БОМБА <span id="bombCooldownText"></span></button>
        </div>
        <div class="controls">
            🖱️ МЫШЬ / ◀ ▶ — пилотирование | 🔫 ПРОБЕЛ / КЛИК — стрельба | 💣 B или кнопка — АТОМНАЯ БОМБА (очищает экран)
        </div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ----- УРОВЕНЬ ИГРЫ (1, 2 или 3) -----
        let currentLevel = 1;
        
        // ----- Игровые переменные -----
        let score = 0;
        let currentHealth = 10;
        let maxHealth = 10;
        let gameRunning = true;
        
        // Флаг босса
        let bossActive = false;
        let bossRockets = []; // ракеты босса
        
        // ----- Корабль -----
        let shipX = canvas.width / 2;
        const SHIP_Y = canvas.height - 60;
        const SHIP_RADIUS = 16;
        
        // ----- Система пуль -----
        let bullets = [];
        let plasmaBullets = [];
        let rockets = [];
        let autoLaserTimer = 0;
        let shootCooldown = 0;
        let plasmaCooldown = 0;
        let droneBullets = [];
        let droneCooldown = 0;
        let bombCooldown = 0;
        
        // Урон от оружия
        const BULLET_DAMAGE = 10;
        const PLASMA_DAMAGE = 30;
        const ROCKET_DAMAGE = 25;
        const LASER_DAMAGE = 10;
        const UPGRADED_PLASMA_DAMAGE = 45;
        const DRONE_DAMAGE = 8;
        
        // ----- Улучшения (уровень 1) -----
        let fireRateLevel = 0;
        let doubleShot = false;
        let tripleShot = false;
        let bulletSpeedLevel = 0;
        let armorLevel = 0;
        let regenLevel = 0;
        
        // ----- Улучшения (уровень 2) -----
        let laserLevel = 0;
        let magnetLevel = 0;
        let shieldLevel = 0;
        let homingLevel = 0;
        let doubleScoreLevel = 0;
        let plasmaLevel = 0;
        
        // ----- Улучшения (уровень 3) -----
        let upgradedPlasmaLevel = 0;
        let megaShieldLevel = 0;
        let turboRegenLevel = 0;
        let atomicBombLevel = 0;
        let criticalLevel = 0;
        let droneLevel = 0;
        
        // Производные характеристики
        let currentFireDelay = 15;
        let currentBulletSpeed = -7;
        let regenCounter = 0;
        let homingCooldown = 0;
        let magnetActive = false;
        let scoreMultiplier = 1;
        let currentPlasmaDamage = PLASMA_DAMAGE;
        
        // Цены (уровень 1)
        const FIRE_RATE_PRICES = [45, 85, 150, 240, 360];
        const DOUBLE_SHOT_PRICE = 120;
        const TRIPLE_SHOT_PRICE = 280;
        const BULLET_SPEED_PRICES = [70, 140, 230];
        const ARMOR_PRICES = [90, 170, 270];
        const REGEN_PRICES = [110, 200, 320];
        
        // Цены (уровень 2)
        const LASER_PRICES = [200, 350];
        const MAGNET_PRICES = [180, 320];
        const SHIELD_PRICES = [250, 400];
        const HOMING_PRICES = [300, 500];
        const DOUBLE_SCORE_PRICES = [400, 700];
        const PLASMA_PRICES = [450, 750];
        
        // Цены (уровень 3)
        const UPGRADED_PLASMA_PRICES = [800, 1200];
        const MEGA_SHIELD_PRICES = [600, 1000];
        const TURBO_REGEN_PRICES = [500, 900];
        const ATOMIC_BOMB_PRICES = [1000, 1500];
        const CRITICAL_PRICES = [700, 1100];
        const DRONE_PRICES = [650, 1050];
        
        // ----- МЕТЕОРИТЫ -----
        let meteors = [];
        const METEOR_BASE_SPEED = 0.7;
        
        // Параметры босса 2 уровня
        const BOSS_2_HP = 500;
        const BOSS_2_REWARD = 800;
        const BOSS_2_SPAWN_CHANCE = 0.3;
        
        // Параметры босса 3 уровня
        const BOSS_3_HP = 800;
        const BOSS_3_REWARD = 1500;
        const BOSS_3_SPAWN_CHANCE = 0.25;
        
        function getMeteorMaxHp(isRadioactive, isMetal, level, isBoss = false) {
            if (isBoss) {
                if (level === 2) return BOSS_2_HP;
                if (level === 3) return BOSS_3_HP;
                return 200;
            }
            if (level === 1) return 20;
            if (level === 2) return isRadioactive ? 50 : 30;
            if (level === 3) return isMetal ? 200 : (isRadioactive ? 80 : 50);
            return 20;
        }
        
        function spawnMeteor() {
            if (currentLevel === 2 && !bossActive && meteors.length === 0 && !anyBossIncoming()) {
                if (Math.random() < BOSS_2_SPAWN_CHANCE) {
                    spawnBossLevel2();
                    return;
                }
            }
            if (currentLevel === 3 && !bossActive && meteors.length === 0 && !anyBossIncoming()) {
                if (Math.random() < BOSS_3_SPAWN_CHANCE) {
                    spawnBossLevel3();
                    return;
                }
            }
            if (bossActive) return;
            
            let radius = 12 + Math.floor(Math.random() * 12);
            let x = Math.random() * (canvas.width - 2*radius) + radius;
            let isRadioactive = (currentLevel >= 2 && Math.random() < 0.3);
            let isMetal = (currentLevel === 3 && Math.random() < 0.4);
            let maxHp = getMeteorMaxHp(isRadioactive, isMetal, currentLevel, false);
            meteors.push({
                x: x,
                y: -radius,
                radius: radius,
                speedY: METEOR_BASE_SPEED + Math.random() * 0.4,
                isRadioactive: isRadioactive,
                isMetal: isMetal,
                isBoss: false,
                hp: maxHp,
                maxHp: maxHp
            });
        }
        
        function anyBossIncoming() {
            for(let m of meteors) {
                if(m.isBoss) return true;
            }
            return false;
        }
        
        function spawnBossLevel2() {
            bossActive = true;
            let radius = 44 + Math.floor(Math.random() * 8);
            let x = Math.random() * (canvas.width - 2*radius) + radius;
            meteors.push({
                x: x,
                y: -radius,
                radius: radius,
                speedY: METEOR_BASE_SPEED * 0.35,
                isRadioactive: true,
                isMetal: false,
                isBoss: true,
                bossLevel: 2,
                hp: BOSS_2_HP,
                maxHp: BOSS_2_HP
            });
            addFloatingText(canvas.width/2, canvas.height/2, "⚠️ ГИГАНТСКИЙ БОСС-КОМЕТА ПРИБЫВАЕТ! ⚠️", "#ff4444");
            updateBossAlert();
        }
        
        function spawnBossLevel3() {
            bossActive = true;
            let radius = 50 + Math.floor(Math.random() * 10);
            let x = Math.random() * (canvas.width - 2*radius) + radius;
            meteors.push({
                x: x,
                y: -radius,
                radius: radius,
                speedY: METEOR_BASE_SPEED * 0.3,
                isRadioactive: false,
                isMetal: true,
                isBoss: true,
                bossLevel: 3,
                hp: BOSS_3_HP,
                maxHp: BOSS_3_HP,
                bossRocketCooldown: 0
            });
            addFloatingText(canvas.width/2, canvas.height/2, "⚠️ ЖЕЛЕЗНЫЙ КОЛОСС ПРИБЫВАЕТ! ⚠️", "#ff8844");
            updateBossAlert();
        }
        
        function updateBossAlert() {
            const levelBadge = document.getElementById('levelBadge');
            if (levelBadge) {
                levelBadge.style.background = "#ff0000";
                levelBadge.style.animation = "pulse 0.5s infinite";
            }
        }
        
        function onBossDefeated() {
            bossActive = false;
            const levelBadge = document.getElementById('levelBadge');
            if (levelBadge) {
                levelBadge.style.background = currentLevel === 3 ? "#aa6600" : "#2a4b6e";
                levelBadge.style.animation = "none";
            }
            addFloatingText(canvas.width/2, canvas.height/2 - 50, "💀 БОСС ПОВЕРЖЕН! 💀", "#ffaa44");
        }
        
        // АТОМНАЯ БОМБА (исправлена)
        function useAtomicBomb() {
            if (atomicBombLevel === 0) {
                addFloatingText(canvas.width/2, canvas.height/2, "❌ Бомба не куплена!", "#ff8888");
                return;
            }
            if (bombCooldown > 0) {
                addFloatingText(canvas.width/2, canvas.height/2, `⏳ Бомба перезаряжается! ${Math.ceil(bombCooldown/60)} сек`, "#ffaa66");
                return;
            }
            if (!gameRunning) {
                addFloatingText(canvas.width/2, canvas.height/2, "❌ Игра окончена!", "#ff8888");
                return;
            }
            
            // Уничтожаем все метеориты
            let destroyedCount = 0;
            for(let i=0;i<meteors.length;i++) {
                let m = meteors[i];
                let reward = m.isBoss ? (m.bossLevel === 3 ? BOSS_3_REWARD : BOSS_2_REWARD) : (m.radius > 18 ? 25 : 15);
                addScore(reward, m.x, m.y);
                addExplosion(m.x, m.y, m.isRadioactive, m.isBoss, m.isMetal);
                destroyedCount++;
            }
            if(bossActive) onBossDefeated();
            meteors = [];
            bossActive = false;
            bossRockets = [];
            bombCooldown = 300; // 5 секунд кулдауна (60fps * 5 = 300)
            addFloatingText(canvas.width/2, canvas.height/2 - 30, `💣 АТОМНАЯ БОМБА! УНИЧТОЖЕНО ${destroyedCount} ЦЕЛЕЙ 💣`, "#ff8844");
            updateBombButtonUI();
        }
        
        function updateBombButtonUI() {
            const bombBtn = document.getElementById('bombButton');
            const bombText = document.getElementById('bombCooldownText');
            if (!bombBtn) return;
            if (atomicBombLevel === 0) {
                bombBtn.classList.add('disabled');
                if(bombText) bombText.innerText = ' (не куплена)';
            } else if (bombCooldown > 0) {
                bombBtn.classList.add('disabled');
                if(bombText) bombText.innerText = ` (${Math.ceil(bombCooldown/60)}с)`;
            } else {
                bombBtn.classList.remove('disabled');
                if(bombText) bombText.innerText = ' (готов)';
            }
        }
        
        // Ракеты босса 3 уровня
        function updateBossRockets() {
            for(let m of meteors) {
                if(m.isBoss && m.bossLevel === 3 && gameRunning) {
                    if(m.bossRocketCooldown === undefined) m.bossRocketCooldown = 0;
                    if(m.bossRocketCooldown <= 0) {
                        let dx = shipX - m.x;
                        let dy = SHIP_Y - m.y;
                        let dist = Math.hypot(dx, dy);
                        if(dist > 0) {
                            bossRockets.push({
                                x: m.x,
                                y: m.y + m.radius/2,
                                targetX: shipX,
                                targetY: SHIP_Y,
                                speed: 2.5,
                                radius: 6,
                                damage: 8,
                                life: 180
                            });
                        }
                        m.bossRocketCooldown = 90;
                    } else {
                        m.bossRocketCooldown--;
                    }
                }
            }
            
            for(let i=0;i<bossRockets.length;i++) {
                const r = bossRockets[i];
                let dx = r.targetX - r.x;
                let dy = r.targetY - r.y;
                let dist = Math.hypot(dx, dy);
                if(dist < 15) {
                    if(gameRunning) {
                        let damage = Math.max(3, r.damage - (megaShieldLevel > 0 ? 4 : 0));
                        currentHealth -= damage;
                        addExplosion(r.x, r.y, false, false);
                        updateHealthUI();
                        if(currentHealth <= 0) {
                            gameRunning = false;
                            currentHealth = 0;
                            updateHealthUI();
                            saveGame();
                        }
                    }
                    bossRockets.splice(i,1);
                    i--;
                    continue;
                }
                let move = Math.min(r.speed, dist);
                r.x += (dx / dist) * move;
                r.y += (dy / dist) * move;
                r.life--;
                if(r.life <= 0) {
                    bossRockets.splice(i,1);
                    i--;
                }
            }
        }
        
        function drawBossRockets() {
            for(let r of bossRockets) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius-1, 0, Math.PI*2);
                ctx.fillStyle = "#ff6644";
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(r.x-10, r.y);
                ctx.lineTo(r.x, r.y-6);
                ctx.lineTo(r.x+10, r.y);
                ctx.lineTo(r.x, r.y+6);
                ctx.fillStyle = "#ffaa44";
                ctx.fill();
            }
        }
        
        let floatingTexts = [];
        function addFloatingText(x, y, text, color = "#ffff88") {
            floatingTexts.push({ x: x, y: y, text: text, life: 40, color: color });
        }
        
        function updateFloatingTexts() {
            for(let i=0;i<floatingTexts.length;i++) {
                floatingTexts[i].life--;
                floatingTexts[i].y -= 0.8;
                if(floatingTexts[i].life <= 0) {
                    floatingTexts.splice(i,1);
                    i--;
                }
            }
        }
        
        function drawFloatingTexts() {
            for(let ft of floatingTexts) {
                ctx.font = "bold 18px monospace";
                ctx.fillStyle = ft.color;
                ctx.shadowBlur = 0;
                ctx.fillText(ft.text, ft.x - ft.text.length * 4, ft.y - 10);
            }
        }
        
        function addScore(amount, x, y) {
            let finalAmount = Math.floor(amount * scoreMultiplier);
            if(criticalLevel > 0 && Math.random() < 0.15 * criticalLevel) {
                finalAmount *= 2;
                addFloatingText(x, y, "CRITICAL x2!", "#ffaa44");
            }
            score += finalAmount;
            addFloatingText(x, y, `+${finalAmount}`, "#ffff88");
            updateUI();
            saveGame();
        }
        
        function damageMeteor(meteor, damage, sourceX, sourceY) {
            let finalDamage = damage;
            if(criticalLevel > 0 && Math.random() < 0.1 * criticalLevel) {
                finalDamage *= 2;
                addFloatingText(meteor.x, meteor.y, "CRIT!", "#ffaa44");
            }
            meteor.hp -= finalDamage;
            addFloatingText(meteor.x, meteor.y, `-${finalDamage}`, "#ff8888");
            if (meteor.hp <= 0) {
                let reward = meteor.isBoss ? (meteor.bossLevel === 3 ? BOSS_3_REWARD : BOSS_2_REWARD) : (meteor.radius > 18 ? 25 : 15);
                addScore(reward, meteor.x, meteor.y);
                addExplosion(meteor.x, meteor.y, meteor.isRadioactive, meteor.isBoss, meteor.isMetal);
                let index = meteors.indexOf(meteor);
                if (index !== -1) meteors.splice(index, 1);
                if (meteor.isBoss) onBossDefeated();
                return true;
            }
            return false;
        }
        
        function drawMeteor(x, y, radius, isRadioactive, isMetal, hp, maxHp, isBoss, bossLevel) {
            const spikes = isBoss ? (bossLevel === 3 ? 16 : 14) : (isMetal ? 10 : 8 + Math.floor(Math.random() * 4));
            const angleStep = (Math.PI * 2) / spikes;
            ctx.save();
            ctx.shadowBlur = isBoss ? 30 : (isMetal ? 15 : 12);
            if (isBoss && bossLevel === 3) {
                ctx.shadowColor = "#ff8844";
            } else if (isBoss) {
                ctx.shadowColor = "#ff0000";
            } else if (isMetal) {
                ctx.shadowColor = "#aaaaaa";
            } else if (isRadioactive) {
                ctx.shadowColor = "#00ff44";
            } else {
                ctx.shadowColor = "#2a1a0a";
            }
            ctx.beginPath();
            for (let i = 0; i < spikes; i++) {
                let angle = i * angleStep;
                let rad = radius * (0.7 + Math.sin(angle * 3) * 0.2 + Math.cos(angle * 2) * 0.1);
                let xOff = Math.cos(angle) * rad;
                let yOff = Math.sin(angle) * rad;
                if (i === 0) ctx.moveTo(x + xOff, y + yOff);
                else ctx.lineTo(x + xOff, y + yOff);
            }
            ctx.closePath();
            
            if (isBoss && bossLevel === 3) {
                let grad = ctx.createLinearGradient(x - radius/2, y - radius/2, x + radius/2, y + radius/2);
                grad.addColorStop(0, "#cc8844");
                grad.addColorStop(0.5, "#885522");
                grad.addColorStop(1, "#442200");
                ctx.fillStyle = grad;
            } else if (isBoss) {
                let grad = ctx.createLinearGradient(x - radius/2, y - radius/2, x + radius/2, y + radius/2);
                grad.addColorStop(0, "#cc2222");
                grad.addColorStop(0.5, "#881111");
                grad.addColorStop(1, "#440000");
                ctx.fillStyle = grad;
            } else if (isMetal) {
                let grad = ctx.createLinearGradient(x - radius/2, y - radius/2, x + radius/2, y + radius/2);
                grad.addColorStop(0, "#aaaaaa");
                grad.addColorStop(0.5, "#777777");
                grad.addColorStop(1, "#444444");
                ctx.fillStyle = grad;
            } else if (isRadioactive) {
                let grad = ctx.createLinearGradient(x - radius/2, y - radius/2, x + radius/2, y + radius/2);
                grad.addColorStop(0, "#88ff44");
                grad.addColorStop(0.5, "#44aa22");
                grad.addColorStop(1, "#226600");
                ctx.fillStyle = grad;
            } else {
                let grad = ctx.createLinearGradient(x - radius/2, y - radius/2, x + radius/2, y + radius/2);
                grad.addColorStop(0, "#7a5a4a");
                grad.addColorStop(0.5, "#5a3e2e");
                grad.addColorStop(1, "#3a2a1e");
                ctx.fillStyle = grad;
            }
            ctx.fill();
            ctx.strokeStyle = isBoss ? "#ff8888" : (isMetal ? "#cccccc" : (isRadioactive ? "#aaff66" : "#2f2418"));
            ctx.lineWidth = isBoss ? 4 : 2;
            ctx.stroke();
            
            let hpPercent = hp / maxHp;
            let barWidth = radius * 1.8;
            let barHeight = isBoss ? 12 : (isMetal ? 6 : 4);
            let barX = x - barWidth/2;
            let barY = y - radius - (isBoss ? 18 : (isMetal ? 12 : 8));
            ctx.fillStyle = "#330000";
            ctx.fillRect(barX, barY, barWidth, barHeight);
            ctx.fillStyle = isBoss ? "#ff8844" : (isMetal ? "#88aaff" : (isRadioactive ? "#44ff44" : "#ff4444"));
            ctx.fillRect(barX, barY, barWidth * hpPercent, barHeight);
            
            if (isBoss) {
                ctx.font = "bold 14px monospace";
                ctx.fillStyle = "#ffaa88";
                ctx.shadowBlur = 0;
                ctx.fillText(`❤️ ${hp}/${maxHp}`, x - 35, y - radius - 12);
                ctx.font = "bold 12px monospace";
                ctx.fillStyle = "#ffaa44";
                ctx.fillText(bossLevel === 3 ? "ЖЕЛЕЗНЫЙ КОЛОСС" : "БОСС", x - 45, y - radius - 25);
            } else if (isMetal) {
                ctx.font = "bold 10px monospace";
                ctx.fillStyle = "#aaaaff";
                ctx.fillText(`${hp}/${maxHp}`, x - 20, y - radius - 6);
            }
            
            let craterCount = isBoss ? 12 : (isMetal ? 6 : (3 + Math.floor(radius/6)));
            for (let i=0;i<craterCount;i++) {
                let craterX = x + (Math.random() - 0.5) * radius * 0.9;
                let craterY = y + (Math.random() - 0.5) * radius * 0.9;
                let craterR = radius * (0.1 + Math.random()*0.15);
                ctx.beginPath();
                ctx.arc(craterX, craterY, craterR, 0, Math.PI*2);
                if (isMetal) {
                    ctx.fillStyle = "#333333cc";
                } else {
                    ctx.fillStyle = isBoss ? "#552222cc" : (isRadioactive ? "#336611cc" : "#2e241acc");
                }
                ctx.fill();
            }
            ctx.restore();
        }
        
        let explosions = [];
        function addExplosion(x,y, isRadioactive = false, isBoss = false, isMetal = false) {
            explosions.push({x:x, y:y, life: isBoss ? 35 : (isMetal ? 20 : 14), isRadioactive: isRadioactive, isBoss: isBoss, isMetal: isMetal});
        }
        
        // Дрон-помощник
        function updateDrone() {
            if(droneLevel === 0) return;
            if(droneCooldown <= 0) {
                droneBullets.push({
                    x: shipX + (Math.random() - 0.5) * 40,
                    y: SHIP_Y - 20,
                    radius: 4,
                    speedY: -6,
                    damage: DRONE_DAMAGE
                });
                droneCooldown = 15 - droneLevel * 3;
            } else {
                droneCooldown--;
            }
            
            for(let i=0;i<droneBullets.length;i++) {
                droneBullets[i].y += droneBullets[i].speedY;
                if(droneBullets[i].y + 10 < 0 || droneBullets[i].y - 10 > canvas.height) {
                    droneBullets.splice(i,1); i--;
                }
            }
            
            for(let i=0;i<droneBullets.length;i++) {
                const d = droneBullets[i];
                let hitIndex = -1;
                for(let j=0;j<meteors.length;j++) {
                    const m = meteors[j];
                    if(Math.hypot(d.x - m.x, d.y - m.y) < d.radius + m.radius) {
                        hitIndex = j;
                        break;
                    }
                }
                if(hitIndex !== -1) {
                    const meteor = meteors[hitIndex];
                    let destroyed = damageMeteor(meteor, d.damage, d.x, d.y);
                    droneBullets.splice(i,1);
                    i--;
                    if (destroyed) addExplosion(meteor.x, meteor.y, meteor.isRadioactive, meteor.isBoss, meteor.isMetal);
                }
            }
        }
        
        function shoot() {
            if (!gameRunning) return;
            
            if (shootCooldown <= 0) {
                let centerX = shipX;
                let centerY = SHIP_Y - SHIP_RADIUS/1.3;
                let damage = BULLET_DAMAGE;
                
                if (tripleShot) {
                    bullets.push({x: centerX - 13, y: centerY, radius: 5, speedY: currentBulletSpeed, damage: damage});
                    bullets.push({x: centerX, y: centerY - 3, radius: 5, speedY: currentBulletSpeed, damage: damage});
                    bullets.push({x: centerX + 13, y: centerY, radius: 5, speedY: currentBulletSpeed, damage: damage});
                } else if (doubleShot) {
                    bullets.push({x: centerX - 9, y: centerY, radius: 5, speedY: currentBulletSpeed, damage: damage});
                    bullets.push({x: centerX + 9, y: centerY, radius: 5, speedY: currentBulletSpeed, damage: damage});
                } else {
                    bullets.push({x: centerX, y: centerY, radius: 5, speedY: currentBulletSpeed, damage: damage});
                }
                shootCooldown = currentFireDelay;
            }
            
            if ((plasmaLevel > 0 || upgradedPlasmaLevel > 0) && plasmaCooldown <= 0) {
                let centerX = shipX;
                let centerY = SHIP_Y - SHIP_RADIUS/1.5;
                let damage = upgradedPlasmaLevel > 0 ? UPGRADED_PLASMA_DAMAGE : currentPlasmaDamage;
                plasmaBullets.push({
                    x: centerX,
                    y: centerY,
                    radius: 8,
                    speedY: currentBulletSpeed * 0.8,
                    damage: damage
                });
                plasmaCooldown = 20 - (plasmaLevel + upgradedPlasmaLevel) * 2;
            }
        }
        
        function updatePlasmaBullets() {
            for(let i=0;i<plasmaBullets.length;i++) {
                plasmaBullets[i].y += plasmaBullets[i].speedY;
                if(plasmaBullets[i].y + 15 < 0 || plasmaBullets[i].y - 15 > canvas.height) {
                    plasmaBullets.splice(i,1); i--;
                }
            }
            if(plasmaCooldown > 0) plasmaCooldown--;
        }
        
        function shootHomingRocket() {
            if (!gameRunning) return;
            if (homingLevel === 0) return;
            if (homingCooldown > 0) return;
            if (meteors.length === 0) return;
            
            let closest = null;
            let closestDist = Infinity;
            for(let m of meteors) {
                let dist = Math.hypot(shipX - m.x, SHIP_Y - m.y);
                if(dist < closestDist) {
                    closestDist = dist;
                    closest = m;
                }
            }
            if(closest) {
                rockets.push({
                    x: shipX,
                    y: SHIP_Y - SHIP_RADIUS,
                    target: closest,
                    speed: 5,
                    radius: 4,
                    life: 120,
                    damage: ROCKET_DAMAGE
                });
                homingCooldown = 50;
            }
        }
        
        function updateRockets() {
            for(let i=0;i<rockets.length;i++) {
                const r = rockets[i];
                if(!r.target || r.target.y > canvas.height + 100 || r.target.y < -100) {
                    rockets.splice(i,1);
                    i--;
                    continue;
                }
                let dx = r.target.x - r.x;
                let dy = r.target.y - r.y;
                let dist = Math.hypot(dx, dy);
                if(dist < 14) {
                    let destroyed = damageMeteor(r.target, r.damage, r.x, r.y);
                    addExplosion(r.x, r.y, r.target.isRadioactive, r.target.isBoss, r.target.isMetal);
                    rockets.splice(i,1);
                    i--;
                    continue;
                }
                let move = Math.min(r.speed, dist);
                r.x += (dx / dist) * move;
                r.y += (dy / dist) * move;
                r.life--;
                if(r.life <= 0) {
                    rockets.splice(i,1);
                    i--;
                }
            }
            if(homingCooldown > 0) homingCooldown--;
        }
        
        function updateAutoLaser() {
            if(laserLevel === 0) return;
            if(autoLaserTimer <= 0) {
                if(meteors.length > 0 && gameRunning) {

                    if(target) {
                        let destroyed = damageMeteor(target, LASER_DAMAGE, target.x, target.y);
                        addFloatingText(target.x, target.y, "⚡", "#88ff88");

                autoLaserTimer = 35 + (3 - laserLevel) * 5;

        function updateBullets() {
            for(let i=0;i<bullets.length;i++) {
                bullets[i].y += bullets[i].speedY;
                if(bullets[i].y + 12 < 0 || bullets[i].y - 12 > canvas.height) {

        function updateMeteorsAndCollisions() {
            for(let i=0;i<meteors.length;i++) {
                const m = meteors[i];
                m.y += m.speedY;
                if(m.y + m.radius > canvas.height + 100) {
                    if(gameRunning) {
                        let damage = m.isBoss ? (m.bossLevel === 3 ? 12 : 10) : (m.isMetal ? 6 : (m.isRadioactive ? 2 : 1));
                        if(megaShieldLevel > 0) damage = Math.max(1, Math.floor(damage / 2));
                        if(m.isRadioactive && shieldLevel > 0 && !m.isBoss) damage = Math.max(1, damage - shieldLevel);
                        currentHealth -= damage;
                        addExplosion(m.x, m.y, m.isRadioactive, m.isBoss, m.isMetal);
                        updateHealthUI();
                        if(currentHealth <= 0) { 
                            gameRunning = false; 
                            currentHealth = 0; 
                            updateHealthUI(); 
                            saveGame();
                        }
                    }
                    if (m.isBoss) bossActive = false;
                    meteors.splice(i,1); i--;
                    continue;
                }
                const dx = shipX - m.x;
                const dy = SHIP_Y - m.y;
                if(Math.hypot(dx,dy) < SHIP_RADIUS + m.radius) {
                    if(gameRunning) {
                        let damage = m.isBoss ? (m.bossLevel === 3 ? 18 : 15) : (m.isMetal ? 10 : (m.isRadioactive ? 3 : 2));
                        if(megaShieldLevel > 0) damage = Math.max(1, Math.floor(damage / 2));
                        if(m.isRadioactive && shieldLevel > 0 && !m.isBoss) damage = Math.max(1, damage - shieldLevel);
                        currentHealth -= damage;
                        addExplosion(m.x, m.y, m.isRadioactive, m.isBoss, m.isMetal);
                        updateHealthUI();
                        if(currentHealth <= 0) { 
                            gameRunning = false; 
                            updateHealthUI(); 
                            saveGame();
                        }
                    }
                    if (m.isBoss) bossActive = false;
                    meteors.splice(i,1); i--;
                    continue;
                }
            }
            
            for(let i=0;i<bullets.length;i++) {
                const b = bullets[i];
                let hitIndex = -1;
                for(let j=0;j<meteors.length;j++) {
                    const m = meteors[j];
                    if(Math.hypot(b.x - m.x, b.y - m.y) < b.radius + m.radius) {
                        hitIndex = j;
                        break;
                    }
                }
                if(hitIndex !== -1) {
                    const meteor = meteors[hitIndex];
                    let destroyed = damageMeteor(meteor, b.damage, b.x, b.y);
                    bullets.splice(i,1);
                    i--;
                    if (destroyed) addExplosion(meteor.x, meteor.y, meteor.isRadioactive, meteor.isBoss, meteor.isMetal);
                }
            }
            
            for(let i=0;i<plasmaBullets.length;i++) {
                const p = plasmaBullets[i];
                let hitIndex = -1;
                for(let j=0;j<meteors.length;j++) {
                    const m = meteors[j];
                    if(Math.hypot(p.x - m.x, p.y - m.y) < p.radius + m.radius) {
                        hitIndex = j;
                        break;
                    }
                }
                if(hitIndex !== -1) {
                    const meteor = meteors[hitIndex];
                    let destroyed = damageMeteor(meteor, p.damage, p.x, p.y);
                    plasmaBullets.splice(i,1);
                    i--;
                    if (destroyed) addExplosion(meteor.x, meteor.y, meteor.isRadioactive, meteor.isBoss, meteor.isMetal);
                    addFloatingText(p.x, p.y, "💥", "#aa88ff");
                }
            }
        }
        
        function applyUpgrades() {
            let reduction = fireRateLevel * 1.6;
            currentFireDelay = Math.max(4, Math.floor(15 - reduction));
            
            let speedIncrease = bulletSpeedLevel * 1.3;
            currentBulletSpeed = -7 - speedIncrease;
            
            let newMaxHealth = 10 + armorLevel * 2 + (megaShieldLevel > 0 ? 5 * megaShieldLevel : 0);
            if (newMaxHealth !== maxHealth) {
                maxHealth = newMaxHealth;
                if (currentHealth > maxHealth) currentHealth = maxHealth;
                document.getElementById('maxHealthValue').innerText = maxHealth;
                updateHealthUI();
            }
            
            magnetActive = magnetLevel > 0;
            scoreMultiplier = doubleScoreLevel + 1;
            currentPlasmaDamage = upgradedPlasmaLevel > 0 ? UPGRADED_PLASMA_DAMAGE : PLASMA_DAMAGE;
        }
        
        function updateRegen() {
            if(!gameRunning) return;
            let regenAmount = regenLevel;
            if(turboRegenLevel > 0) regenAmount += turboRegenLevel * 2;
            if(regenAmount > 0 && currentHealth < maxHealth) {
                if(regenCounter <= 0) {
                    currentHealth = Math.min(maxHealth, currentHealth + regenAmount);
                    updateHealthUI();
                    regenCounter = 80 - turboRegenLevel * 10;
                    saveGame();
                } else {
                    regenCounter--;
                }
            }
        }
        
        let spawnCounter = 0;
        function updateSpawning() {
            if(!gameRunning) return;
            if (bossActive) return;
            
            let baseDelay = Math.max(45, 80 - Math.floor(score / 400));
            if(spawnCounter <= 0) {
                if(meteors.length < 18) spawnMeteor();
                if(Math.random()<0.2 && meteors.length<22) spawnMeteor();
                spawnCounter = baseDelay;
            } else {
                spawnCounter--;
            }
        }

            document.getElementById('healthValue').innerText = currentHealth;
            document.getElementById('maxHealthValue').innerText = maxHealth;

        function updateUI() {

        let targetX = shipX;

        function updateShip() {
            if (!gameRunning) return;
            let move = 0;
            if(keys.ArrowLeft) move = -1;
            if(keys.ArrowRight) move = 1;
            let newX;
            if(move !== 0) newX = shipX + move * 7.5;
            else {
                let diff = targetX - shipX;
                newX = shipX + Math.sign(diff) * Math.min(Math.abs(diff), 6.5);
            }
            newX = Math.min(Math.max(newX, SHIP_RADIUS + 12), canvas.width - SHIP_RADIUS - 12);
            shipX = newX;
        }
        
        function updateExplosions() {
            for(let i=0;i<explosions.length;i++) {
                explosions[i].life--;
                if(explosions[i].life<=0) { explosions.splice(i,1); i--; }
            }
        }
        
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#010008";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            for(let i=0;i<300;i++) {
                ctx.fillStyle = `rgba(255,240,200,${0.3+Math.sin(Date.now()*0.002+i)*0.2})`;
                ctx.beginPath();
                ctx.arc((i*311)%canvas.width, (i*131)%canvas.height, 1.2,0,Math.PI*2);
                ctx.fill();
            }
            for(let m of meteors) drawMeteor(m.x, m.y, m.radius, m.isRadioactive, m.isMetal, m.hp, m.maxHp, m.isBoss, m.bossLevel);
            drawSpaceship(shipX, SHIP_Y, SHIP_RADIUS);
            
            for(let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius-1, 0, Math.PI*2);
                ctx.fillStyle = "#ffe484";
                ctx.shadowBlur = 8;
                ctx.fill();
            }
            for(let p of plasmaBullets) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius-2, 0, Math.PI*2);
                let color = upgradedPlasmaLevel > 0 ? "#ff8844" : "#44aaff";
                ctx.fillStyle = color;
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius-4, 0, Math.PI*2);
                ctx.fillStyle = upgradedPlasmaLevel > 0 ? "#ffcc88" : "#88ddff";
                ctx.fill();
            }
            for(let d of droneBullets) {
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius-1, 0, Math.PI*2);
                ctx.fillStyle = "#88aaff";
                ctx.fill();
            }
            for(let r of rockets) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, 5, 0, Math.PI*2);
                ctx.fillStyle = "#ff6644";
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(r.x-8, r.y);
                ctx.lineTo(r.x, r.y-5);
                ctx.lineTo(r.x+8, r.y);
                ctx.lineTo(r.x, r.y+5);
                ctx.fillStyle = "#ffaa44";
                ctx.fill();
            }
            drawBossRockets();
            for(let ex of explosions) {
                let size = ex.isBoss ? 18+ex.life/1.2 : (ex.isMetal ? 12+ex.life/1.5 : 7+ex.life/2);
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, size, 0, Math.PI*2);
                if(ex.isBoss) {
                    ctx.fillStyle = `rgba(255,80,50,${ex.life/35})`;
                } else if(ex.isMetal) {
                    ctx.fillStyle = `rgba(150,150,200,${ex.life/20})`;
                } else if(ex.isRadioactive) {
                    ctx.fillStyle = `rgba(100,255,50,${ex.life/12})`;
                } else {
                    ctx.fillStyle = `rgba(230,100,20,${ex.life/12})`;
                }
                ctx.fill();
            }
            drawFloatingTexts();
            
            ctx.shadowBlur = 0;
            if(!gameRunning) {
                ctx.font = "bold 30monospace";
                ctx.fillStyle = "#ffaa88";
                ctx.fillText("💀 КОРАБЛЬ РАЗРУШЕН", canvas.width/2-170, canvas.height/2-50);
                ctx.font = "16px monospace";
                ctx.fillStyle = "#88aaff";
                ctx.fillText("Покупайте улучшения и нажмите «НОВЫЙ ПОЛЁТ»", canvas.width/2-250, canvas.height/2+10);
            }
            if (bossActive && currentLevel === 3) {
                ctx.font = "bold 24px monospace";
                ctx.fillStyle = "#ff8844";
                ctx.shadowBlur = 6;
                ctx.fillText("⚠️ ЖЕЛЕЗНЫЙ КОЛОСС ⚠️", canvas.width/2-190, 55);
            } else if (bossActive && currentLevel === 2) {
                ctx.font = "bold 24px monospace";
                ctx.fillStyle = "#ff4444";
                ctx.shadowBlur = 6;
                ctx.fillText("⚠️ ГИГАНТСКИЙ БОСС-КОМЕТА ⚠️", canvas.width/2-200, 55);
            }
            ctx.beginPath();
            ctx.arc(mouseX, SHIP_Y-18, 13, 0, Math.PI*2);
            ctx.strokeStyle = "#88ffaa";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.moveTo(mouseX-24, SHIP_Y-18);
            ctx.lineTo(mouseX+24, SHIP_Y-18);
            ctx.moveTo(mouseX, SHIP_Y-42);
            ctx.lineTo(mouseX, SHIP_Y+6);
            ctx.stroke();
        }
        
        function renderShop() {
            const panel = document.getElementById('shopPanel');
            if (!panel) return;
            panel.innerHTML = '';
            
            let items = [];
            if (currentLevel === 1) {
                items = [
                    { id:'fireRate', name:'🔫 СКОРОСТРЕЛЬНОСТЬ', level: fireRateLevel, max: 5, getPrice: () => FIRE_RATE_PRICES[fireRateLevel] },
                    { id:'doubleShot', name:'⚡ ДВОЙНАЯ ПУШКА', level: doubleShot ? 1 : 0, max: 1, getPrice: () => DOUBLE_SHOT_PRICE, disabled: tripleShot },
                    { id:'tripleShot', name:'💥 ТРОЙНАЯ ПУШКА', level: tripleShot ? 1 : 0, max: 1, getPrice: () => TRIPLE_SHOT_PRICE, disabled: doubleShot },
                    { id:'bulletSpeed', name:'🚀 БЫСТРЫЕ ПУЛИ', level: bulletSpeedLevel, max: 3, getPrice: () => BULLET_SPEED_PRICES[bulletSpeedLevel] },
                    { id:'armor', name:'🛡️ БРОНЯ', level: armorLevel, max: 3, getPrice: () => ARMOR_PRICES[armorLevel] },
                    { id:'regen', name:'💚 РЕГЕНЕРАЦИЯ', level: regenLevel, max: 3, getPrice: () => REGEN_PRICES[regenLevel] }
                ];
            } else if (currentLevel === 2) {
                items = [
                    { id:'plasma', name:'🔵 ПЛАЗМЕННАЯ ПУШКА', level: plasmaLevel, max: 2, getPrice: () => PLASMA_PRICES[plasmaLevel] },
                    { id:'laser', name:'⚡ АВТОЛАЗЕР', level: laserLevel, max: 2, getPrice: () => LASER_PRICES[laserLevel] },
                    { id:'magnet', name:'🧲 МАГНИТ', level: magnetLevel, max: 2, getPrice: () => MAGNET_PRICES[magnetLevel] },
                    { id:'shield', name:'🛡️ РАДИОАКТИВНЫЙ ЩИТ', level: shieldLevel, max: 2, getPrice: () => SHIELD_PRICES[shieldLevel] },
                    { id:'homing', name:'🎯 САМОНАВОДЯЩИЕСЯ РАКЕТЫ', level: homingLevel, max: 2, getPrice: () => HOMING_PRICES[homingLevel] },
                    { id:'doubleScore', name:'💎 УДВОЕНИЕ ОЧКОВ', level: doubleScoreLevel, max: 2, getPrice: () => DOUBLE_SCORE_PRICES[doubleScoreLevel] }
                ];
            } else {
                items = [
                    { id:'upgradedPlasma', name:'🔥 УЛУЧШЕННАЯ ПЛАЗМА', level: upgradedPlasmaLevel, max: 2, getPrice: () => UPGRADED_PLASMA_PRICES[upgradedPlasmaLevel] },
                    { id:'megaShield', name:'🛡️ МЕГАЩИТ', level: megaShieldLevel, max: 2, getPrice: () => MEGA_SHIELD_PRICES[megaShieldLevel] },
                    { id:'turboRegen', name:'💚 ТУРБОРЕГЕНЕРАЦИЯ', level: turboRegenLevel, max: 2, getPrice: () => TURBO_REGEN_PRICES[turboRegenLevel] },
                    { id:'atomicBomb', name:'💣 АТОМНАЯ БОМБА', level: atomicBombLevel, max: 2, getPrice: () => ATOMIC_BOMB_PRICES[atomicBombLevel] },
                    { id:'critical', name:'⭐ КРИТИЧЕСКИЙ УРОН', level: criticalLevel, max: 2, getPrice: () => CRITICAL_PRICES[criticalLevel] },
                    { id:'drone', name:'🤖 ДРОН-ПОМОЩНИК', level: droneLevel, max: 2, getPrice: () => DRONE_PRICES[droneLevel] }
                ];
            }
            
            for(let it of items) {
                const price = it.getPrice();
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                let priceText = (price !== undefined && price !== null) ? price : 'MAX';
                let isMaxLevel = it.level >= it.max;
                let isDisabled = it.disabled === true;
                
                if (isMaxLevel) priceText = '✅ MAX';
                if (isDisabled) priceText = '🔒 ЗАНЯТО';
                
                card.innerHTML = `<div class="upgrade-name">${it.name}</div>
                                 <div class="upgrade-level">ур. ${it.level}/${it.max}</div>
                                 <div class="upgrade-price">💎 ${priceText}</div>`;
                
                if (!isMaxLevel && !isDisabled && typeof price === 'number') {
                    card.onclick = (e) => { e.stopPropagation(); buyUpgrade(it.id); };
                    if (score < price) card.style.opacity = "0.5";
                } else {
                    card.style.opacity = "0.6";
                    card.style.cursor = "default";
                }
                panel.appendChild(card);
            }
        }
        
        function buyUpgrade(type) {
            switch(type) {
                case 'fireRate':
                    if (fireRateLevel >= 5) return false;
                    let p1 = FIRE_RATE_PRICES[fireRateLevel];
                    if(score >= p1) { score -= p1; fireRateLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'doubleShot':
                    if (doubleShot || tripleShot) return false;
                    if(score >= DOUBLE_SHOT_PRICE) { score -= DOUBLE_SHOT_PRICE; doubleShot = true; updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'tripleShot':
                    if (tripleShot || doubleShot) return false;
                    if(score >= TRIPLE_SHOT_PRICE) { score -= TRIPLE_SHOT_PRICE; tripleShot = true; updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'bulletSpeed':
                    if (bulletSpeedLevel >= 3) return false;
                    let p2 = BULLET_SPEED_PRICES[bulletSpeedLevel];
                    if(score >= p2) { score -= p2; bulletSpeedLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'armor':
                    if (armorLevel >= 3) return false;
                    let p3 = ARMOR_PRICES[armorLevel];
                    if(score >= p3) { score -= p3; armorLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'regen':
                    if (regenLevel >= 3) return false;
                    let p4 = REGEN_PRICES[regenLevel];
                    if(score >= p4) { score -= p4; regenLevel++; updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'plasma':
                    if (plasmaLevel >= 2) return false;
                    let pPlasma = PLASMA_PRICES[plasmaLevel];
                    if(score >= pPlasma) { score -= pPlasma; plasmaLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'laser':
                    if (laserLevel >= 2) return false;
                    let p5 = LASER_PRICES[laserLevel];
                    if(score >= p5) { score -= p5; laserLevel++; updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'magnet':
                    if (magnetLevel >= 2) return false;
                    let p6 = MAGNET_PRICES[magnetLevel];
                    if(score >= p6) { score -= p6; magnetLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'shield':
                    if (shieldLevel >= 2) return false;
                    let p7 = SHIELD_PRICES[shieldLevel];
                    if(score >= p7) { score -= p7; shieldLevel++; updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'homing':
                    if (homingLevel >= 2) return false;
                    let p8 = HOMING_PRICES[homingLevel];
                    if(score >= p8) { score -= p8; homingLevel++; updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'doubleScore':
                    if (doubleScoreLevel >= 2) return false;
                    let p9 = DOUBLE_SCORE_PRICES[doubleScoreLevel];
                    if(score >= p9) { score -= p9; doubleScoreLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); checkLevelUp(); return true; }
                    break;
                case 'upgradedPlasma':
                    if (upgradedPlasmaLevel >= 2) return false;
                    let pUpPlasma = UPGRADED_PLASMA_PRICES[upgradedPlasmaLevel];
                    if(score >= pUpPlasma) { score -= pUpPlasma; upgradedPlasmaLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); return true; }
                    break;
                case 'megaShield':
                    if (megaShieldLevel >= 2) return false;
                    let pMega = MEGA_SHIELD_PRICES[megaShieldLevel];
                    if(score >= pMega) { score -= pMega; megaShieldLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); return true; }
                    break;
                case 'turboRegen':
                    if (turboRegenLevel >= 2) return false;
                    let pTurbo = TURBO_REGEN_PRICES[turboRegenLevel];
                    if(score >= pTurbo) { score -= pTurbo; turboRegenLevel++; updateUI(); renderShop(); saveGame(); return true; }
                    break;
                case 'atomicBomb':
                    if (atomicBombLevel >= 2) return false;
                    let pBomb = ATOMIC_BOMB_PRICES[atomicBombLevel];
                    if(score >= pBomb) { score -= pBomb; atomicBombLevel++; updateUI(); renderShop(); saveGame(); updateBombButtonUI(); return true; }
                    break;
                case 'critical':
                    if (criticalLevel >= 2) return false;
                    let pCrit = CRITICAL_PRICES[criticalLevel];
                    if(score >= pCrit) { score -= pCrit; criticalLevel++; applyUpgrades(); updateUI(); renderShop(); saveGame(); return true; }
                    break;
                case 'drone':
                    if (droneLevel >= 2) return false;
                    let pDrone = DRONE_PRICES[droneLevel];
                    if(score >= pDrone) { score -= pDrone; droneLevel++; updateUI(); renderShop(); saveGame(); return true; }
                    break;
            }
            alert("Не хватает очков!");
            return false;
        }
        
        function saveGame() {
            const gameState = {
                score: score,
                currentHealth: currentHealth,
                maxHealth: maxHealth,
                currentLevel: currentLevel,
                fireRateLevel: fireRateLevel,
                doubleShot: doubleShot,
                tripleShot: tripleShot,
                bulletSpeedLevel: bulletSpeedLevel,
                armorLevel: armorLevel,
                regenLevel: regenLevel,
                laserLevel: laserLevel,
                magnetLevel: magnetLevel,
                shieldLevel: shieldLevel,
                homingLevel: homingLevel,
                doubleScoreLevel: doubleScoreLevel,
                plasmaLevel: plasmaLevel,
                upgradedPlasmaLevel: upgradedPlasmaLevel,
                megaShieldLevel: megaShieldLevel,
                turboRegenLevel: turboRegenLevel,
                atomicBombLevel: atomicBombLevel,
                criticalLevel: criticalLevel,
                droneLevel: droneLevel,
                shipX: shipX,
                gameRunning: gameRunning,
                bossActive: bossActive,
                bombCooldown: bombCooldown
            };
            localStorage.setItem('meteorDefenderFinal3', JSON.stringify(gameState));
        }
        
        function loadGame() {
            const saved = localStorage.getItem('meteorDefenderFinal3');
            if (!saved) return false;
            try {
                const state = JSON.parse(saved);
                score = state.score;
                currentHealth = state.currentHealth;
                maxHealth = state.maxHealth;
                currentLevel = state.currentLevel;
                fireRateLevel = state.fireRateLevel;
                doubleShot = state.doubleShot;
                tripleShot = state.tripleShot;
                bulletSpeedLevel = state.bulletSpeedLevel;
                armorLevel = state.armorLevel;
                regenLevel = state.regenLevel;
                laserLevel = state.laserLevel || 0;
                magnetLevel = state.magnetLevel || 0;
                shieldLevel = state.shieldLevel || 0;
                homingLevel = state.homingLevel || 0;
                doubleScoreLevel = state.doubleScoreLevel || 0;
                plasmaLevel = state.plasmaLevel || 0;
                upgradedPlasmaLevel = state.upgradedPlasmaLevel || 0;
                megaShieldLevel = state.megaShieldLevel || 0;
                turboRegenLevel = state.turboRegenLevel || 0;
                atomicBombLevel = state.atomicBombLevel || 0;
                criticalLevel = state.criticalLevel || 0;
                droneLevel = state.droneLevel || 0;
                shipX = state.shipX;
                gameRunning = state.gameRunning;
                bossActive = state.bossActive || false;
                bombCooldown = state.bombCooldown || 0;
                targetX = shipX;
                mouseX = shipX;
                
                document.getElementById('levelValue').innerText = currentLevel;
                if(currentLevel === 3) {
                    document.getElementById('levelBadge').style.background = "#aa6600";
                    document.getElementById('levelBadge').classList.add('level-3-badge');
                } else if(currentLevel === 2) {
                    document.getElementById('levelBadge').style.background = "#2a4b6e";
                }
                applyUpgrades();
                updateUI();
                renderShop();
                updateBombButtonUI();
                return true;
            } catch(e) { return false; }
        }
        
        function restartGame() {
            gameRunning = true;
            currentHealth = maxHealth;
            bullets = [];
            plasmaBullets = [];
            rockets = [];
            bossRockets = [];
            droneBullets = [];
            explosions = [];
            floatingTexts = [];
            shootCooldown = 0;
            plasmaCooldown = 0;
            homingCooldown = 0;
            autoLaserTimer = 0;
            droneCooldown = 0;
            shipX = canvas.width / 2;
            targetX = shipX;
            mouseX = shipX;
            regenCounter = 0;
            bossActive = false;
            bombCooldown = 0;
            
            meteors = [];
            for(let i=0;i<3;i++) spawnMeteor();
            
            const levelBadge = document.getElementById('levelBadge');
            if (levelBadge) {
                if(currentLevel === 3) levelBadge.style.background = "#aa6600";
                else levelBadge.style.background = "#2a4b6e";
                levelBadge.style.animation = "none";
            }
            
            updateUI();
            updateBombButtonUI();
            saveGame();
        }
        
        function gameUpdate() {
            if(gameRunning) {
                if(shootCooldown > 0) shootCooldown--;
                if(bombCooldown > 0) {
                    bombCooldown--;
                    updateBombButtonUI();
                }
                updateShip();
                updateBullets();
                updatePlasmaBullets();
                updateRockets();
                updateAutoLaser();
                updateDrone();
                shootHomingRocket();
                updateMeteorsAndCollisions();
                updateSpawning();
                updateBossRockets();
                updateExplosions();
                updateRegen();
                updateFloatingTexts();
            }
            draw();
            requestAnimationFrame(gameUpdate);
        }
        
        function initEvents() {
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width/rect.width;
                let canvasX = (e.clientX - rect.left) * scaleX;
                canvasX = Math.min(Math.max(canvasX, SHIP_RADIUS+12), canvas.width-SHIP_RADIUS-12);
                targetX = canvasX;
                mouseX = canvasX;
            });
            canvas.addEventListener('click', () => shoot());
            window.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') { keys[e.key]=true; e.preventDefault(); }
                if(e.key === ' ' || e.key === 'Space') { shoot(); e.preventDefault(); }
                if(e.key === 'b' || e.key === 'B' || e.key === 'ы' || e.key === 'И') { 
                    useAtomicBomb();
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => {
                if(e.key === 'ArrowLeft' || e.key === 'ArrowRight') keys[e.key]=false;
            });
            document.getElementById('restartButton').addEventListener('click', () => { restartGame(); });
            document.getElementById('bombButton').addEventListener('click', () => { useAtomicBomb(); });
        }
        
        function init() {
            initEvents();
            if(!loadGame()) {
                currentHealth = 10;
                maxHealth = 10;
                score = 0;
                currentLevel = 1;
                restartGame();
            } else {
                if (gameRunning) {
                    meteors = [];
                    for(let i=0;i<3;i++) spawnMeteor();
                } else {
                    meteors = [];
                }
            }
            renderShop();
            gameUpdate();
        }
        init();
    })();
</script>
</body>
</html>
